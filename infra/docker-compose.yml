services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: payflow
      POSTGRES_PASSWORD: payflow
      POSTGRES_DB: payflow
    ports:
      - "5432:5432"
    volumes:
      - payflow_db:/var/lib/postgresql/data

  api:
    build: ../services/api
    environment:
      DATABASE_URL: postgresql+psycopg://payflow:payflow@db:5432/payflow
    ports:
      - "8080:8080"
    depends_on:
      - db

volumes:
  payflow_db:
